[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "experiments"
version = "0.1.0"
description = "Запуск и оценка экспериментов агентов"
requires-python = ">=3.10"
dependencies = [
    "robomap",
    "robomap-client",
    "agents[llm]",
    "meta-agent",
    "GitPython>=3.1,<4"
]

[project.scripts]
robomap-experiment = "experiments.robomap.cli:main"

[project.optional-dependencies]
llm = [
    "agents[llm]",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
