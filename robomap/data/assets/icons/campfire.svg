<svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg" style="background-color: transparent;">
    <!--
      Изображение дров из предоставленной картинки
      с добавленным стилизованным костром.
      Позиция огня скорректирована, чтобы он был ниже и полностью видим.
    -->
    <defs>
        <!-- Градиенты для Дров -->
        <radialGradient id="logEndGradientStylized" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" stop-color="#FDEECA"/>
            <stop offset="30%" stop-color="#F1D9A8"/>
            <stop offset="60%" stop-color="#E5C486"/>
            <stop offset="100%" stop-color="#D8AF64"/>
        </radialGradient>
        <linearGradient id="barkColorStylized" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#8E755C"/>
            <stop offset="100%" stop-color="#7A644F"/>
        </linearGradient>
        <linearGradient id="ringColor" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#B29A77"/>
            <stop offset="100%" stop-color="#A38B6A"/>
        </linearGradient>

        <!-- Градиенты для Огня -->
        <linearGradient id="fireGradientOuter" x1="0.5" y1="1" x2="0.5" y2="0">
            <stop offset="0%" stop-color="#FFC978"/>
            <stop offset="50%" stop-color="#F9884A"/>
            <stop offset="100%" stop-color="#E85D35"/>
        </linearGradient>
        <linearGradient id="fireGradientInner" x1="0.5" y1="1" x2="0.5" y2="0">
            <stop offset="0%" stop-color="#FEF7E1"/>
            <stop offset="100%" stop-color="#FFD990"/>
        </linearGradient>
    </defs>

    <!-- Главная группа для всей композиции. Смещена вниз, чтобы огонь был виден. -->
    <g transform="translate(100, 80)">

        <!-- Группа для дров -->
        <g id="firewood-logs" transform="translate(0, 50)">
            <!-- Полено 1: Заднее, горизонтальное -->
            <g id="log-back" transform="translate(0, 50)">
                <path d="M 30 10 Q 150 0, 270 10 L 265 80 Q 150 90, 35 80 Z" fill="url(#barkColorStylized)"/>
                <g transform="translate(35, 45)"><ellipse cx="0" cy="0" rx="35" ry="35" fill="url(#logEndGradientStylized)"/><ellipse cx="0" cy="0" rx="28" ry="28" fill="none" stroke="url(#ringColor)" stroke-width="2"/><ellipse cx="0" cy="0" rx="20" ry="20" fill="none" stroke="url(#ringColor)" stroke-width="2"/><ellipse cx="0" cy="0" rx="12" ry="12" fill="none" stroke="url(#ringColor)" stroke-width="2"/><path d="M0 0 L-10 30 L-5 30 Z" fill="url(#ringColor)"/><path d="M0 0 L10 30 L5 30 Z" fill="url(#ringColor)"/></g>
                <g transform="translate(265, 45)"><ellipse cx="0" cy="0" rx="35" ry="35" fill="url(#logEndGradientStylized)"/><ellipse cx="0" cy="0" rx="28" ry="28" fill="none" stroke="url(#ringColor)" stroke-width="2"/><ellipse cx="0" cy="0" rx="20" ry="20" fill="none" stroke="url(#ringColor)" stroke-width="2"/><ellipse cx="0" cy="0" rx="12" ry="12" fill="none" stroke="url(#ringColor)" stroke-width="2"/><path d="M0 0 L0 30 L5 30 Z" fill="url(#ringColor)"/></g>
            </g>
            <!-- Полено 2: Переднее, левое -->
            <g id="log-front-left" transform="translate(60, 80) rotate(5)">
                <path d="M 20 10 Q 80 0, 130 20 L 120 90 Q 70 100, 30 80 Z" fill="url(#barkColorStylized)"/>
                <g transform="translate(25, 45) rotate(2)"><ellipse cx="0" cy="0" rx="35" ry="35" fill="url(#logEndGradientStylized)"/><ellipse cx="0" cy="0" rx="28" ry="28" fill="none" stroke="url(#ringColor)" stroke-width="2"/><ellipse cx="0" cy="0" rx="20" ry="20" fill="none" stroke="url(#ringColor)" stroke-width="2"/><ellipse cx="0" cy="0" rx="12" ry="12" fill="none" stroke="url(#ringColor)" stroke-width="2"/><path d="M -5 32 L 0 0 L 5 32 z" fill="#4D4036" transform="rotate(180)"/></g>
            </g>
            <!-- Полено 3: Переднее, правое -->
            <g id="log-front-right" transform="translate(140, 75) rotate(-5)">
                <path d="M 20 10 Q 80 0, 130 20 L 120 90 Q 70 100, 30 80 Z" fill="url(#barkColorStylized)"/>
                <g transform="translate(125, 55) rotate(0)"><ellipse cx="0" cy="0" rx="35" ry="35" fill="url(#logEndGradientStylized)"/><ellipse cx="0" cy="0" rx="28" ry="28" fill="none" stroke="url(#ringColor)" stroke-width="2"/><ellipse cx="0" cy="0" rx="20" ry="20" fill="none" stroke="url(#ringColor)" stroke-width="2"/><ellipse cx="0" cy="0" rx="12" ry="12" fill="none" stroke="url(#ringColor)" stroke-width="2"/><path d="M -5 32 L 0 0 L 5 32 z" fill="#4D4036"/></g>
            </g>
        </g>

        <!-- Группа для Огня. Смещена вниз, чтобы сидеть на дровах. -->
        <g id="fire" transform="translate(150, 30)">
            <!-- Анимированные искорки -->
            <circle cx="0" cy="30" r="4" fill="#FFC978" opacity="0.8">
                <animateTransform attributeName="transform" type="translate" values="0,0; 5,-60; 5,-60" keyTimes="0; 0.8; 1" dur="2s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="0.8; 0" dur="2s" repeatCount="indefinite" />
            </circle>
            <circle cx="20" cy="20" r="3" fill="#F9884A">
                <animateTransform attributeName="transform" type="translate" values="0,0; -10,-80; -10,-80" keyTimes="0; 0.9; 1" dur="2.5s" begin="0.5s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="1; 0" dur="2.5s" begin="0.5s" repeatCount="indefinite" />
            </circle>

            <!-- Слой 1: Внешнее пламя (самое темное) -->
            <path d="M -5,90 C -90,90 -80,-50 0,-100 C 80,-50 90,90 5,90 Z" fill="url(#fireGradientOuter)"/>

            <!-- Слой 2: Среднее пламя -->
            <path d="M 0,95 C -70,95 -60,-20 0,-70 C 60,-20 70,95 0,95 Z" fill="url(#fireGradientInner)" transform="scale(0.85) translate(0, -10)"/>

            <!-- Слой 3: Внутреннее пламя (самое светлое ядро) -->
            <path d="M 0,95 C -40,90 -45,20 0,-10 C 45,20 40,90 0,95 Z" fill="#FEF7E1" transform="scale(0.6) translate(0, 10)"/>

            <!-- Блики -->
            <path d="M -15 0 C -15 20, 15 20, 15 0 C 15 -20, -15 -20, -15 0 Z" fill="white" fill-opacity="0.7" transform="translate(-28, -25) rotate(-30) scale(0.7)"/>
            <path d="M -10 0 C -10 15, 10 15, 10 0 C 10 -15, -10 -15, -10 0 Z" fill="white" fill-opacity="0.6" transform="translate(25, 20) rotate(40) scale(0.9)"/>
        </g>
    </g>
</svg>