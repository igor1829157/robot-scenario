<svg width="100" height="150" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
    <title>Елка для карты</title>

    <!-- Ствол -->
    <rect x="45" y="130" width="10" height="20" fill="#654321" />

    <!-- Хвоя - слои снизу вверх -->

    <!-- Самый нижний, самый темный слой -->
    <path d="M 10 135
           L 20 115
           L 15 118
           L 30 95
           L 25 98
           L 50 70
           L 75 98
           L 70 95
           L 85 118
           L 80 115
           L 90 135 Z"
          fill="#006400" /> <!-- DarkGreen -->

    <!-- Средний слой, чуть светлее -->
    <path d="M 20 118
           L 30 100
           L 25 102
           L 40 80
           L 35 82
           L 50 55
           L 65 82
           L 60 80
           L 75 102
           L 70 100
           L 80 118 Z"
          fill="#228B22" /> <!-- ForestGreen -->

    <!-- Верхний-средний слой, еще светлее -->
    <path d="M 30 103
           L 38 88
           L 33 90
           L 45 70
           L 40 72
           L 50 40
           L 60 72
           L 55 70
           L 67 90
           L 62 88
           L 70 103 Z"
          fill="#3CB371" /> <!-- MediumSeaGreen -->

    <!-- Самый верхний, самый светлый слой (верхушка) -->
    <path d="M 42 75
           L 47 60
           L 44 62
           L 50 30
           L 56 62
           L 53 60
           L 58 75 Z"
          fill="#5DBB63" /> <!-- Примерно как #90EE90, но чуть насыщеннее -->

</svg>