<svg width="120" height="150" viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
    <title>Сломанная елка для карты</title>

    <!-- Нижняя часть ствола (обломок) -->
    <rect x="45" y="100" width="10" height="50" fill="#654321" />

    <!-- Место слома (светлая древесина) -->
    <path d="M 44 100
           L 47 97
           L 45 96
           L 48 94
           L 52 94
           L 55 96
           L 53 97
           L 56 100 Z"
          fill="#D2B48C" /> <!-- Tan / LightWood -->

    <!-- Упавшая/сломанная верхняя часть -->
    <g transform="translate(20, 70) rotate(75 50 50)">
        <!-- Небольшой остаток ствола в упавшей части -->
        <rect x="47" y="45" width="6" height="15" fill="#654321" />

        <!-- Хвоя упавшей части - слои -->
        <!-- Самый "нижний" (теперь боковой) слой упавшей части -->
        <path d="M 10 60
             L 20 40
             L 15 43
             L 30 20
             L 25 23
             L 50 -5
             L 75 23
             L 70 20
             L 85 43
             L 80 40
             L 90 60 Z"
              fill="#006400" />

        <!-- Средний слой упавшей части -->
        <path d="M 20 43
             L 30 25
             L 25 27
             L 40 5
             L 35 7
             L 50 -20
             L 65 7
             L 60 5
             L 75 27
             L 70 25
             L 80 43 Z"
              fill="#228B22" />

        <!-- Верхний слой (верхушка) упавшей части -->
        <path d="M 35 10
             L 45 -5
             L 42 -3
             L 50 -30
             L 58 -3
             L 55 -5
             L 65 10 Z"
              fill="#3CB371" />
    </g>

    <!-- Опционально: Несколько отдельных "веточек" или хвоинок у основания -->
    <path d="M 30 145 L 35 135 L 40 145 Z" fill="#006400" opacity="0.7"/>
    <path d="M 60 140 L 68 130 L 75 142 Z" fill="#228B22" opacity="0.7"/>

</svg>