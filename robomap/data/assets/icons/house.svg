<svg width="200" height="180" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
    <title>Детальный арктический дом</title>

    <!-- Основание/Фундамент/Небольшой сугроб у дома -->
    <path d="M 10 160
           Q 20 150, 30 155
           L 170 155
           Q 180 150, 190 160
           L 190 170 L 10 170 Z"
          fill="#E0E0E0"/> <!-- Светло-серый для снега/основания -->

    <!-- Стены дома -->
    <g id="walls">
        <!-- Передняя стена -->
        <rect x="30" y="80" width="140" height="80" fill="#A0522D" /> <!-- Sienna / Коричневый для дерева -->
        <!-- Боковая стена (для эффекта объема) -->
        <path d="M 170 80
             L 190 70
             L 190 150
             L 170 160 Z"
              fill="#8B4513" /> <!-- SaddleBrown / Темнее коричневый -->
    </g>

    <!-- Крыша -->
    <g id="roof">
        <!-- Передняя часть крыши -->
        <path d="M 20 85
             L 100 30
             L 180 85 Z"
              fill="#696969" /> <!-- DimGray / Темно-серый для крыши -->
        <!-- Боковая часть крыши -->
        <path d="M 180 85
             L 100 30
             L 115 22
             L 200 70 Z"
              fill="#505050" /> <!-- Еще темнее серый -->
    </g>

    <!-- Дверь -->
    <g id="door">
        <rect x="50" y="110" width="30" height="50" fill="#4A3B31" /> <!-- Темно-коричневый (почти черный) -->
        <!-- Ручка двери -->
        <circle cx="75" cy="135" r="2.5" fill="#C0C0C0" /> <!-- Серебристый -->
        <!-- Небольшой козырек над дверью -->
        <path d="M 45 110 L 85 110 L 88 105 L 42 105 Z" fill="#505050"/>
    </g>

    <!-- Окна -->
    <g id="windows">
        <!-- Окно 1 (на передней стене) -->
        <rect x="100" y="100" width="40" height="30" fill="#ADD8E6" /> <!-- LightBlue / Голубой для стекла -->
        <rect x="98" y="98" width="44" height="34" fill="#704214" stroke="#503010" stroke-width="1.5"/> <!-- Деревянная рама -->
        <!-- Переплет окна 1 -->
        <line x1="120" y1="98" x2="120" y2="132" stroke="#503010" stroke-width="1.5"/>
        <line x1="98" y1="115" x2="142" y2="115" stroke="#503010" stroke-width="1.5"/>

        <!-- Окно 2 (на боковой стене, с искажением перспективы) -->
        <path d="M 175 95
             L 185 90
             L 185 110
             L 175 115 Z"
              fill="#ADD8E6"/>
        <path d="M 174 94
             L 186 89
             L 186 111
             L 174 116 Z"
              stroke="#704214" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Труба -->
    <g id="chimney">
        <path d="M 140 55
             L 140 30
             L 155 30
             L 155 50 Z"
              fill="#B22222" /> <!-- Firebrick / Кирпичный -->
        <!-- Верхняя часть трубы (объем) -->
        <path d="M 155 30
             L 160 27
             L 160 47
             L 155 50 Z"
              fill="#8B0000" /> <!-- DarkRed -->
        <!-- Дымок из трубы (опционально) -->
        <path d="M 147 28
             Q 145 20, 150 18
             Q 155 20, 152 12
             Q 160 15, 155 5 Z"
              fill="#D3D3D3" opacity="0.7"/> <!-- LightGray / Светло-серый дым -->
    </g>

    <!-- Снег на крыше -->
    <g id="snow-on-roof">
        <path d="M 20 85
             Q 30 80, 40 82
             L 100 40
             L 160 82
             Q 170 80, 180 85
             L 175 85
             L 100 45
             L 25 85 Z"
              fill="white" opacity="0.9"/>
        <path d="M 180 85
             Q 170 80, 160 82
             L 100 40
             L 115 32
             Q 120 35, 125 38
             L 195 70
             Q 198 72, 200 70
             L 198 70
             L 118 30
             L 100 45
             L 175 85 Z"
              fill="white" opacity="0.85"/>
    </g>

    <!-- Сосульки (опционально) -->
    <g id="icicles" fill="white" opacity="0.6">
        <path d="M 60 85 L 62 95 L 64 85 Z"/>
        <path d="M 90 85 L 91 92 L 93 85 Z"/>
        <path d="M 120 85 L 123 98 L 126 85 Z"/>
        <path d="M 150 85 L 152 93 L 154 85 Z"/>

        <!-- Сосулька на боковой части крыши -->
        <path d="M 185 70 L 187 76 L 189 70 L 188 70 L 187 75 L 186 70 Z" transform="rotate(15 185 70)"/>

    </g>

</svg>