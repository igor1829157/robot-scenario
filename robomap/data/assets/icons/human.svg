<svg width="100" height="180" viewBox="0 0 100 180" xmlns="http://www.w3.org/2000/svg">
    <title>Человечек в арктической одежде</title>

    <!-- Ноги и Ботинки -->
    <g id="legs-and-boots">
        <!-- Левый ботинок -->
        <path d="M 20 175
             Q 15 175, 15 170
             L 15 150
             Q 15 145, 20 145
             L 38 145
             Q 43 145, 43 150
             L 43 170
             Q 43 175, 38 175 Z"
              fill="#4A4A4A"/> <!-- Темно-серый для ботинок -->
        <!-- Правый ботинок -->
        <path d="M 60 175
             Q 55 175, 55 170
             L 55 150
             Q 55 145, 60 145
             L 78 145
             Q 83 145, 83 150
             L 83 170
             Q 83 175, 78 175 Z"
              fill="#4A4A4A"/>

        <!-- Левая штанина -->
        <path d="M 22 150
             L 25 100
             L 45 100
             L 40 150 Z"
              fill="#5F7C8A"/> <!-- Серо-синий для штанов -->
        <!-- Правая штанина -->
        <path d="M 55 150
             L 58 100
             L 78 100
             L 73 150 Z"
              fill="#5F7C8A"/>
    </g>

    <!-- Тело и Куртка (Парка) -->
    <g id="torso-and-parka">
        <!-- Основная часть куртки -->
        <path d="M 20 105
             L 15 60
             Q 15 40, 30 35
             L 70 35
             Q 85 40, 85 60
             L 80 105 Z"
              fill="#D62828"/> <!-- Ярко-красный для заметности -->

        <!-- Карманы (декоративные) -->
        <rect x="25" y="75" width="15" height="20" rx="3" fill="#B02020" /> <!-- Темнее красного -->
        <rect x="60" y="75" width="15" height="20" rx="3" fill="#B02020" />

        <!-- Левый рукав -->
        <path d="M 15 65
             Q 5 60, 5 50
             L 10 35
             Q 15 30, 20 35
             L 25 60
             Q 20 65, 15 65 Z"
              fill="#D62828"/>
        <!-- Правый рукав -->
        <path d="M 85 65
             Q 95 60, 95 50
             L 90 35
             Q 85 30, 80 35
             L 75 60
             Q 80 65, 85 65 Z"
              fill="#D62828"/>

        <!-- Перчатки/Рукавицы -->
        <path d="M 2 50 Q 0 45, 5 32 L 10 30 L 13 34 Q 15 40, 10 52 Z" fill="#333333"/> <!-- Темно-серый -->
        <path d="M 98 50 Q 100 45, 95 32 L 90 30 L 87 34 Q 85 40, 90 52 Z" fill="#333333"/>
    </g>

    <!-- Голова и Капюшон -->
    <g id="head-and-hood">
        <!-- Капюшон (внешняя часть) -->
        <path d="M 30 45
             Q 25 25, 50 15
             Q 75 25, 70 45
             L 65 48
             Q 50 55, 35 48 Z"
              fill="#D62828"/>

        <!-- Опушка капюшона (мех) -->
        <path d="M 32 43
             Q 28 28, 50 20
             Q 72 28, 68 43
             L 64 45
             Q 50 50, 36 45 Z"
              fill="#E0E0E0"/> <!-- Светло-серый/белый для меха -->

        <!-- Лицо (небольшой видимый участок) -->
        <ellipse cx="50" cy="35" rx="10" ry="12" fill="#F4C58E"/> <!-- Телесный цвет -->

        <!-- Очки/Маска (линзы) -->
        <path d="M 38 38
             Q 40 30, 50 30
             Q 60 30, 62 38
             Q 60 42, 50 42
             Q 40 42, 38 38 Z"
              fill="#222222" opacity="0.8"/> <!-- Темные линзы -->
        <!-- Оправа очков (частично) -->
        <path d="M 37 39 L 35 38 M 63 39 L 65 38" stroke="#4A4A4A" stroke-width="1.5" fill="none"/>
    </g>

</svg>