<svg width="250" height="180" viewBox="0 0 250 180" xmlns="http://www.w3.org/2000/svg">
    <title>Красное высокое барьерное ограждение</title>

    <defs>
        <linearGradient id="metalShineBarrierRed" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:white; stop-opacity:0.25"/>
            <stop offset="50%" style="stop-color:white; stop-opacity:0.1"/>
            <stop offset="100%" style="stop-color:white; stop-opacity:0.05"/>
        </linearGradient>
    </defs>

    <!-- Снег/земля у основания (рисуем первым) -->
    <path d="M 0 170
           Q 20 155, 40 160
           L 210 160
           Q 230 155, 250 170
           L 250 180 L 0 180 Z"
          fill="#F0F4FF" /> <!-- Очень светлый синевато-белый для снега -->

    <!-- Стойки ограждения (3 штуки для примера) - сделаем их выше -->
    <g id="posts-red">
        <!-- Стойка 1 -->
        <g transform="translate(30 0)">
            <rect x="0" y="50" width="14" height="115" fill="#B22222"/> <!-- Firebrick - основной цвет стойки -->
            <path d="M 14 50 L 17 47 L 17 162 L 14 165 Z" fill="#DC143C"/> <!-- Crimson - Чуть светлее для боковой грани -->
            <rect x="-1" y="48" width="16" height="5" fill="#8B0000" rx="1"/> <!-- DarkRed - "Шапка" стойки -->
        </g>
        <!-- Стойка 2 -->
        <g transform="translate(115 0)">
            <rect x="0" y="50" width="14" height="115" fill="#B22222"/>
            <path d="M 14 50 L 17 47 L 17 162 L 14 165 Z" fill="#DC143C"/>
            <rect x="-1" y="48" width="16" height="5" fill="#8B0000" rx="1"/>
        </g>
        <!-- Стойка 3 -->
        <g transform="translate(200 0)">
            <rect x="0" y="50" width="14" height="115" fill="#B22222"/>
            <path d="M 14 50 L 17 47 L 17 162 L 14 165 Z" fill="#DC143C"/>
            <rect x="-1" y="48" width="16" height="5" fill="#8B0000" rx="1"/>
        </g>
    </g>

    <!-- Балка ограждения (W-образная) - поднимаем ее -->
    <g id="beam-red" transform="translate(0 -20)"> <!-- Поднимаем всю балку на 20px вверх -->
        <!-- Основная видимая часть балки -->
        <path d="M 15 80
             L 235 80
             L 235 83
             C 230 88, 225 88, 220 83
             L 220 112
             C 225 117, 230 117, 235 112
             L 235 115
             L 15 115
             L 15 112
             C 20 117, 25 117, 30 112
             L 30 83
             C 25 88, 20 88, 15 83
             L 15 80 Z"
              fill="#D62828" /> <!-- Ярко-красный (как у человечка) - основной цвет балки -->

        <!-- Верхняя грань балки для объема -->
        <path d="M 15 80
             L 18 77
             L 232 77
             L 235 80

             L 230 80
             L 228 78
             L 22 78
             L 20 80
             Z"
              fill="#F04A4A" /> <!-- Светлее красного для верхней грани -->

        <!-- "Волны" на W-балке (детализация) -->
        <!-- Верхняя волна -->
        <path d="M 15 83
             C 20 88, 25 88, 30 83
             L 220 83
             C 225 88, 230 88, 235 83"
              fill="none" stroke="#A00000" stroke-width="1.5"/> <!-- Темно-красный для линий -->
        <!-- Нижняя волна -->
        <path d="M 15 112
             C 20 107, 25 107, 30 112
             L 220 112
             C 225 107, 230 107, 235 112"
              fill="none" stroke="#A00000" stroke-width="1.5"/>
        <!-- Центральная впадина (линия тени) -->
        <line x1="30" y1="97.5" x2="220" y2="97.5" stroke="#B22222" stroke-width="2"/>

        <!-- Блеск на балке -->
        <path d="M 15 80
             L 235 80
             L 235 83
             C 230 88, 225 88, 220 83
             L 220 112
             C 225 117, 230 117, 235 112
             L 235 115
             L 15 115
             L 15 112
             C 20 117, 25 117, 30 112
             L 30 83
             C 25 88, 20 88, 15 83
             L 15 80 Z"
              fill="url(#metalShineBarrierRed)" />
    </g>

    <!-- Крепежные элементы (болты - опционально, для детализации) -->
    <g id="fasteners-red" fill="#800000" transform="translate(0 -20)"> <!-- Также поднимаем болты -->
        <!-- На стойке 1 -->
        <circle cx="37" cy="90" r="3"/> <circle cx="37" cy="105" r="3"/> <!-- Слегка сместил X для новых стоек и увеличил радиус -->
        <!-- На стойке 2 -->
        <circle cx="122" cy="90" r="3"/> <circle cx="122" cy="105" r="3"/>
        <!-- На стойке 3 -->
        <circle cx="207" cy="90" r="3"/> <circle cx="207" cy="105" r="3"/>
    </g>

    <!-- Немного снега на ограждении (опционально) -->
    <g id="snow-on-barrier-red" fill="white" opacity="0.8" transform="translate(0 -20)"> <!-- И снег на балке тоже поднимаем -->
        <path d="M 18 77
             Q 25 74, 35 76
             L 215 76
             Q 225 74, 232 77
             L 230 79
             L 20 79 Z"/>
    </g>

</svg>