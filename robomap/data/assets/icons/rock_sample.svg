<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <title>Арктический камень</title>

    <!-- Снег у основания камня (рисуем первым, чтобы камень был "на" нем) -->
    <path d="M 5 98
           Q 15 85, 30 90
           C 40 92, 60 92, 70 90
           Q 85 85, 95 98
           L 95 100 L 5 100 Z"
          fill="#F0F8FF" /> <!-- AliceBlue - очень светлый, холодный оттенок для снега -->

    <!-- Основное тело камня (самый темный слой, имитирующий тень или нижнюю часть) -->
    <path d="M 20 90
           L 15 70
           C 10 50, 30 40, 45 42
           C 60 38, 80 45, 85 65
           L 90 80
           C 85 95, 60 98, 40 96
           C 30 95, 20 90, 20 90 Z"
          fill="#607D8B" /> <!-- Blue Grey 600 (из палитры Material Design) - хороший каменный цвет -->

    <!-- Средний тон / Основная видимая часть камня -->
    <path d="M 22 85
           L 18 68
           C 15 52, 32 42, 45 40
           C 58 37, 75 44, 80 62
           L 85 75
           C 80 90, 58 94, 40 92
           C 30 91, 22 85, 22 85 Z"
          fill="#78909C" /> <!-- Blue Grey 500 -->

    <!-- Светлая часть / Блик на верхней грани -->
    <path d="M 48 41
           C 35 43, 25 55, 28 65
           C 35 55, 50 48, 65 50
           C 75 55, 70 68, 65 70
           C 68 60, 60 45, 48 41 Z"
          fill="#90A4AE" /> <!-- Blue Grey 400 -->

    <!-- Небольшие трещинки/детали (опционально) -->
    <path d="M 40 50 Q 45 55, 50 52" stroke="#546E7A" stroke-width="1" fill="none" />
    <path d="M 60 65 Q 55 70, 58 75" stroke="#546E7A" stroke-width="1" fill="none" />

</svg>