<svg width="320" height="200" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
    <title>Детализированный арктический внедорожник v2 - Сломанный</title>

    <defs>
        <linearGradient id="windowGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#B0C4DE; stop-opacity:0.8"/> <!-- LightSteelBlue -->
            <stop offset="100%" style="stop-color:#778899; stop-opacity:0.9"/> <!-- LightSlateGray -->
        </linearGradient>
        <linearGradient id="bodyShine2" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:white; stop-opacity:0.35"/>
            <stop offset="30%" style="stop-color:white; stop-opacity:0.15"/>
            <stop offset="100%" style="stop-color:white; stop-opacity:0.0"/>
        </linearGradient>
        <radialGradient id="tireGradient2" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="75%" style="stop-color:#282828;"/>
            <stop offset="95%" style="stop-color:#181818;"/>
        </radialGradient>
        <radialGradient id="headlightGlow" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
            <stop offset="0%" style="stop-color:white; stop-opacity:0.8"/>
            <stop offset="100%" style="stop-color:#FFFFE0; stop-opacity:0"/>
        </radialGradient>
    </defs>

    <!-- Тень под машиной (модифицирована) -->
    <ellipse cx="155" cy="190" rx="125" ry="13" fill="black" opacity="0.2"/>

    <!-- Колеса -->
    <g id="wheels-v2">
        <!-- Заднее колесо -->
        <g id="wheel-rear-v2" transform="translate(245 150)">
            <circle r="35" fill="url(#tireGradient2)" stroke="#101010" stroke-width="1.5"/>
            <circle r="17" fill="#B0B0B0" stroke="#707070" stroke-width="2"/> <!-- Диск -->
            <circle r="6" fill="#505050"/> <!-- Центральная часть диска -->
            <circle cx="0" cy="11" r="2" fill="#404040"/> <circle cx="0" cy="-11" r="2" fill="#404040"/>
            <circle cx="11" cy="0" r="2" fill="#404040"/> <circle cx="-11" cy="0" r="2" fill="#404040"/>
            <circle cx="7.7" cy="7.7" r="2" fill="#404040"/> <circle cx="-7.7" cy="7.7" r="2" fill="#404040"/>
            <circle cx="7.7" cy="-7.7" r="2" fill="#404040"/> <circle cx="-7.7" cy="-7.7" r="2" fill="#404040"/>
        </g>
        <!-- Переднее колесо (МОДИФИЦИРОВАНО) -->
        <g id="wheel-front-v2" transform="translate(72 158) rotate(-12 0 0)">
            <circle r="35" fill="url(#tireGradient2)" stroke="#101010" stroke-width="1.5"/>
            <circle r="17" fill="#A0A0A0" stroke="#606060" stroke-width="2"/> <!-- Диск (чуть темнее/грязнее) -->
            <circle r="6" fill="#404040"/> <!-- Центральная часть диска (темнее) -->
            <circle cx="0" cy="11" r="2" fill="#404040"/> <circle cx="0" cy="-11" r="2" fill="#404040"/>
            <circle cx="11" cy="0" r="2" fill="#404040"/> <circle cx="-11" cy="0" r="2" fill="#303030"/> <!-- один темнее/ржавый -->
            <!-- <circle cx="7.7" cy="7.7" r="2" fill="#404040"/> --> <!-- MISSING BOLT -->
            <circle cx="-7.7" cy="7.7" r="2" fill="#404040"/>
            <circle cx="7.7" cy="-7.7" r="2" fill="#404040"/> <circle cx="-7.7" cy="-7.7" r="2" fill="#404040"/>
        </g>
    </g>

    <!-- Кузов (слегка наклонен) -->
    <g id="body-v2" transform="rotate(-0.5 160 100)">
        <!-- Нижняя основная часть кузова (темнее для основы) -->
        <path d="M 25 150
             L 40 95
             L 280 95
             L 295 150
             C 290 158, 260 160, 245 160
             L 75 160
             C 60 160, 30 158, 25 150 Z"
              fill="#004D40"/>

        <!-- Основной цвет кузова -->
        <path d="M 28 148
             L 42 98
             L 278 98
             L 292 148
             C 288 155, 258 157, 245 157
             L 75 157
             C 62 157, 32 155, 28 148 Z"
              fill="#00796B" stroke="#003D33" stroke-width="1"/>

        <!-- Кабина (верхняя часть) -->
        <path d="M 70 100
             L 90 50
             L 230 50
             L 250 100
             Z" fill="#00695C" stroke="#003D33" stroke-width="1"/>

        <!-- Крыша -->
        <path d="M 95 50 L 90 40 L 230 40 L 225 50 Z" fill="#004D40" stroke="#00251E" stroke-width="0.5"/>

        <!-- Окна -->
        <g id="windows-v2">
            <!-- Лобовое стекло -->
            <path d="M 93 52 L 75 98 L 120 98 L 125 52 Z" fill="url(#windowGradient2)" stroke="#444" stroke-width="1"/>
            <!-- Боковое переднее -->
            <path d="M 130 52 L 125 98 L 175 98 L 180 52 Z" fill="url(#windowGradient2)" stroke="#444" stroke-width="1"/>
            <!-- Боковое заднее -->
            <path d="M 185 52 L 180 98 L 225 98 L 230 52 Z" fill="url(#windowGradient2)" stroke="#444" stroke-width="1"/>
            <!-- Заднее маленькое окошко (если есть) -->
            <path d="M 235 52 L 230 98 L 245 98 L 248 75 Q 248 60, 243 52 Z" fill="url(#windowGradient2)" stroke="#444" stroke-width="1" />
        </g>

        <!-- Линии дверей -->
        <line x1="128" y1="51" x2="123" y2="155" stroke="#003D33" stroke-width="1.5"/>
        <line x1="183" y1="51" x2="178" y2="155" stroke="#003D33" stroke-width="1.5"/>

        <!-- Дверные ручки -->
        <rect x="110" y="105" width="15" height="5" rx="1" fill="#37474F"/>
        <rect x="165" y="105" width="15" height="5" rx="1" fill="#37474F"/>
        <rect x="210" y="105" width="15" height="5" rx="1" fill="#37474F"/>

        <!-- Капот (линия) -->
        <path d="M 42 98 Q 55 90, 75 98" stroke="#003D33" stroke-width="1.5" fill="none"/>

        <!-- Передняя часть: решетка и фары (МОДИФИЦИРОВАНО) -->
        <g id="front-v2">
            <!-- Решетка (с вмятиной) -->
            <rect x="42" y="100" width="28" height="35" fill="#405059" rx="2"/> <!-- Слегка помятый цвет -->
            <path d="M 44 108 q 4 -2 8 0.5 q 4 1.5 8 -0.5 l 1.5 8 l -19 2 Z" fill="#354A54" opacity="0.8"/> <!-- Вмятина на решетке -->
            <line x1="45" y1="105" x2="67" y2="105" stroke="#506D7B" stroke-width="2.5"/>
            <line x1="45" y1="115" x2="67" y2="115" stroke="#506D7B" stroke-width="2.5"/>
            <line x1="45" y1="125" x2="67" y2="125" stroke="#506D7B" stroke-width="2.5"/>

            <!-- Фары (ОДНА СЛОМАНА) -->
            <!-- <ellipse cx="55" cy="90" rx="15" ry="10" fill="#ECEFF1"/> -->
            <!-- <ellipse cx="55" cy="90" rx="8" ry="5" fill="#FFF9C4"/> -->
            <!-- <ellipse cx="55" cy="90" rx="18" ry="13" fill="url(#headlightGlow)" /> -->
            <g id="headlight-broken-v2">
                <ellipse cx="55" cy="90" rx="15" ry="10" fill="#607D8B" stroke="#455A64" stroke-width="0.5"/>
                <path d="M 48 87 l 6 5 l -2 4 l 9 -2.5" stroke="#212121" stroke-width="1.2" fill="none"/>
                <path d="M 58 86 l -3 7 l 4.5 2.5" stroke="#212121" stroke-width="1" fill="none"/>
            </g>
            <!-- Поворотник под фарой (треснутый) -->
            <rect x="45" y="102" width="20" height="5" fill="#FFB74D" rx="1"/>
            <line x1="50" y1="103" x2="58" y2="106" stroke="#A32F2F" stroke-width="0.7"/> <!-- Трещина на поворотнике -->
        </g>

        <!-- Задняя часть: фонари -->
        <g id="rear-v2">
            <rect x="278" y="100" width="10" height="25" fill="#EF5350" rx="2"/>
            <rect x="278" y="125" width="10" height="8" fill="#FFB74D" rx="1"/>
        </g>

        <!-- Бамперы (ПЕРЕДНИЙ МОДИФИЦИРОВАН) -->
        <!-- <rect x="20" y="135" width="60" height="18" rx="3" fill="#37474F"/> --> <!-- Передний оригинал -->
        <path id="bumper-front-bent-v2" d="M 18 136 C 28 132, 40 142, 50 138 C 58 135, 70 144, 78 140 L 75 152 L 23 154 L 18 142 Z" fill="#37474F" stroke="#1A2327" stroke-width="0.5"/>
        <rect x="240" y="135" width="65" height="18" rx="3" fill="#37474F"/> <!-- Задний -->

        <!-- Пороги/подножки -->
        <rect x="78" y="150" width="162" height="10" fill="#455A64" rx="2"/>

        <!-- Колесные арки -->
        <path d="M 40 150 C 40 120, 70 115, 75 115 S 110 120, 110 150 Z" fill="#003D33" opacity="0.5"/>
        <path d="M 210 150 C 210 120, 240 115, 245 115 S 280 120, 280 150 Z" fill="#003D33" opacity="0.5"/>

        <!-- Блеск на кузове (МОДИФИЦИРОВАН) -->
        <path d="M 95 42 L 225 42 L 220 48 L 100 48 Z" fill="url(#bodyShine2)" opacity="0.5"/>
        <path d="M 80 55 L 240 55 L 235 95 L 85 95 Z" fill="url(#bodyShine2)" opacity="0.4"/>
        <!-- <path d="M 45 100 L 65 100 L 60 145 L 38 145 Z" fill="url(#bodyShine2)" opacity="0.5"/> --> <!-- Removed this shine -->
    </g>

    <!-- Аксессуары (слегка наклонены, МОДИФИЦИРОВАНЫ) -->
    <g id="accessories-v2" transform="rotate(-0.5 160 100)">
        <!-- Люстра на крыше (одна лампа разбита) -->
        <rect x="100" y="30" width="120" height="10" rx="2" fill="#263238"/>
        <circle cx="110" cy="35" r="4" fill="#FFFDE7" stroke="#101010" stroke-width="0.5"/>
        <circle cx="130" cy="35" r="4" fill="#424242" stroke="#101010" stroke-width="0.5"/> <!-- Разбитая лампа -->
        <circle cx="150" cy="35" r="4" fill="#FFFDE7" stroke="#101010" stroke-width="0.5"/>
        <circle cx="170" cy="35" r="4" fill="#FFFDE7" stroke="#101010" stroke-width="0.5"/>
        <circle cx="190" cy="35" r="4" fill="#FFFDE7" stroke="#101010" stroke-width="0.5"/>
        <circle cx="210" cy="35" r="4" fill="#FFFDE7" stroke="#101010" stroke-width="0.5"/>

        <!-- Зеркало бокового вида (треснутое) -->
        <path d="M 123 55 L 115 58 L 113 70 L 120 72 L 125 68 L 123 55 Z" fill="#405059"/>
        <!-- <path d="M 116 60 L 115 68 L 119 69 L 121 62 Z" fill="url(#windowGradient2)" opacity="0.7"/> --> <!-- Original mirror surface -->
        <path d="M 116 60 L 115 68 L 119 69 L 121 62 Z" fill="#78909C" opacity="0.9"/> <!-- Треснутое стекло -->
        <path d="M 116.5 61.5 l 2.5 4 l -1.5 2" stroke="#212121" stroke-width="0.7" fill="none"/> <!-- Трещина -->
    </g>

    <!-- Снег на машине (грязный/подтаявший, МОДИФИЦИРОВАН) -->
    <g id="snow-on-car-v2" fill="#D8D4CC" opacity="0.6">
        <path d="M 92 40 Q 100 35, 110 36 L 210 36 Q 220 35, 228 40 L 225 42 L 95 42 Z"/>
        <path d="M 42 98 Q 50 94, 70 98 L 65 101 Q 50 97, 45 101 Z"/>
    </g>

    <!-- Дополнительные эффекты повреждений (НОВОЕ) -->
    <g id="extra-damage-effects">
        <!-- Трещины на лобовом стекле -->
        <path d="M 95 62 L 103 76 L 96 82 L 112 92 L 107 96" stroke="#333333" stroke-width="1.5" fill="none" opacity="0.65"/>
        <path d="M 82 83 L 92 72 L 103 68" stroke="#333333" stroke-width="1" fill="none" opacity="0.55"/>

        <!-- Вмятина на капоте/переднем крыле -->
        <path d="M 55 102 c -7 2 -4 -6 2.5 -7 s 9 1.5 7.5 5 s -5.5 3.5 -2.5 -0.5 Z" fill="#004D40" opacity="0.7" transform="rotate(-10 55 102)"/>
        <!-- Царапина на боку -->
        <path d="M 140 120 C 155 117, 170 123, 185 118" stroke="#003D33" stroke-width="1.5" fill="none" opacity="0.7"/>
        <path d="M 142 122 C 157 119, 172 125, 187 120" stroke="#004D40" stroke-width="0.8" fill="none" opacity="0.5"/>
        <!-- Еще одна вмятина на двери -->
        <ellipse cx="200" cy="115" rx="18" ry="7" fill="#004D40" opacity="0.6" transform="rotate(-10 200 115)"/>
        <ellipse cx="200" cy="115" rx="14" ry="4" fill="#003D33" opacity="0.5" transform="rotate(-10 200 115)"/>
    </g>
</svg>