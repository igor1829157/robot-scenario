<svg width="500" height="250" viewBox="0 0 500 250" xmlns="http://www.w3.org/2000/svg" style="background-color: transparent;">
  <!--
    Изображение дров из предоставленной картинки
    Без костра и камней, с сохранением стилистики.
    Позиция полена 2 (переднее, левое) скорректирована ниже.
  -->
  <defs>
    <!-- Радиальный градиент для торцов поленьев (годичные кольца) -->
    <radialGradient id="logEndGradientStylized" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FDEECA"/>
      <stop offset="30%" stop-color="#F1D9A8"/>
      <stop offset="60%" stop-color="#E5C486"/>
      <stop offset="100%" stop-color="#D8AF64"/>
    </radialGradient>

    <!-- Цвет для коры -->
    <linearGradient id="barkColorStylized" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8E755C"/>
      <stop offset="100%" stop-color="#7A644F"/>
    </linearGradient>

    <!-- Цвет для годичных колец и трещин -->
    <linearGradient id="ringColor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B29A77"/>
      <stop offset="100%" stop-color="#A38B6A"/>
    </linearGradient>

  </defs>

  <!-- Главная группа для всей композиции дров -->
  <g id="firewood-logs" transform="translate(50, 50)">

    <!-- Полено 1: Заднее, горизонтальное -->
    <g id="log-back" transform="translate(0, 50)">
      <!-- Тело полена (кора) -->
      <path d="M 30 10 Q 150 0, 270 10 L 265 80 Q 150 90, 35 80 Z" fill="url(#barkColorStylized)"/>
      <!-- Левый торец -->
      <g transform="translate(35, 45) rotate(0)">
        <ellipse cx="0" cy="0" rx="35" ry="35" fill="url(#logEndGradientStylized)"/>
        <!-- Кольца -->
        <ellipse cx="0" cy="0" rx="28" ry="28" fill="none" stroke="url(#ringColor)" stroke-width="2"/>
        <ellipse cx="0" cy="0" rx="20" ry="20" fill="none" stroke="url(#ringColor)" stroke-width="2"/>
        <ellipse cx="0" cy="0" rx="12" ry="12" fill="none" stroke="url(#ringColor)" stroke-width="2"/>
        <!-- Трещины -->
        <path d="M0 0 L-10 30 L-5 30 Z" fill="url(#ringColor)"/>
        <path d="M0 0 L10 30 L5 30 Z" fill="url(#ringColor)"/>
      </g>
      <!-- Правый торец -->
      <g transform="translate(265, 45) rotate(0)">
        <ellipse cx="0" cy="0" rx="35" ry="35" fill="url(#logEndGradientStylized)"/>
        <!-- Кольца -->
        <ellipse cx="0" cy="0" rx="28" ry="28" fill="none" stroke="url(#ringColor)" stroke-width="2"/>
        <ellipse cx="0" cy="0" rx="20" ry="20" fill="none" stroke="url(#ringColor)" stroke-width="2"/>
        <ellipse cx="0" cy="0" rx="12" ry="12" fill="none" stroke="url(#ringColor)" stroke-width="2"/>
        <!-- Трещина -->
        <path d="M0 0 L0 30 L5 30 Z" fill="url(#ringColor)"/>
      </g>
    </g>

    <!-- Полено 2: Переднее, левое - ПОНИЖЕ -->
    <g id="log-front-left" transform="translate(80, 30) rotate(5)">
      <!-- Тело полена (кора) -->
      <path d="M 20 10 Q 80 0, 130 20 L 120 90 Q 70 100, 30 80 Z" fill="url(#barkColorStylized)"/>
      <!-- Торец -->
      <g transform="translate(25, 45) rotate(2)">
        <ellipse cx="0" cy="0" rx="35" ry="35" fill="url(#logEndGradientStylized)"/>
        <!-- Кольца -->
        <ellipse cx="0" cy="0" rx="28" ry="28" fill="none" stroke="url(#ringColor)" stroke-width="2"/>
        <ellipse cx="0" cy="0" rx="20" ry="20" fill="none" stroke="url(#ringColor)" stroke-width="2"/>
        <ellipse cx="0" cy="0" rx="12" ry="12" fill="none" stroke="url(#ringColor)" stroke-width="2"/>
        <!-- Трещины -->
        <path d="M0 0 L-10 30 L-5 30 Z" fill="url(#ringColor)"/>
        <path d="M0 0 L10 30 L5 30 Z" fill="url(#ringColor)"/>
      </g>
    </g>

    <!-- Полено 3: Переднее, правое -->
    <g id="log-front-right" transform="translate(190, 25) rotate(10)">
      <!-- Тело полена (кора) -->
      <path d="M 20 10 Q 80 0, 130 20 L 120 90 Q 70 100, 30 80 Z" fill="url(#barkColorStylized)"/>
      <!-- Торец -->
      <g transform="translate(25, 45) rotate(0)">
        <ellipse cx="0" cy="0" rx="35" ry="35" fill="url(#logEndGradientStylized)"/>
        <!-- Кольца -->
        <ellipse cx="0" cy="0" rx="28" ry="28" fill="none" stroke="url(#ringColor)" stroke-width="2"/>
        <ellipse cx="0" cy="0" rx="20" ry="20" fill="none" stroke="url(#ringColor)" stroke-width="2"/>
        <ellipse cx="0" cy="0" rx="12" ry="12" fill="none" stroke="url(#ringColor)" stroke-width="2"/>
        <!-- Трещина (стилизованная V-образная) -->
        <path d="M0 0 L-15 30 L0 20 L15 30 Z" fill="url(#ringColor)"/>
      </g>
    </g>

  </g>
</svg>