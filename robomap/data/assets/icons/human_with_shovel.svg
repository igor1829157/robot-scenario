<svg width="130" height="180" viewBox="0 0 130 180" xmlns="http://www.w3.org/2000/svg">
    <title>Человечек в арктической одежде с лопатой</title>

    <!-- Ноги и Ботинки -->
    <g id="legs-and-boots">
        <!-- Левый ботинок -->
        <path d="M 20 175 Q 15 175, 15 170 L 15 150 Q 15 145, 20 145 L 38 145 Q 43 145, 43 150 L 43 170 Q 43 175, 38 175 Z" fill="#4A4A4A"/>
        <!-- Правый ботинок -->
        <path d="M 60 175 Q 55 175, 55 170 L 55 150 Q 55 145, 60 145 L 78 145 Q 83 145, 83 150 L 83 170 Q 83 175, 78 175 Z" fill="#4A4A4A"/>

        <!-- Левая штанина -->
        <path d="M 22 150 L 25 100 L 45 100 L 40 150 Z" fill="#5F7C8A"/>
        <!-- Правая штанина -->
        <path d="M 55 150 L 58 100 L 78 100 L 73 150 Z" fill="#5F7C8A"/>
    </g>

    <!-- Тело и Куртка (Левая часть и основа) -->
    <g id="torso-and-parka">
        <!-- Основная часть куртки -->
        <path d="M 20 105 L 15 60 Q 15 40, 30 35 L 70 35 Q 85 40, 85 60 L 80 105 Z" fill="#D62828"/>

        <!-- Карманы (декоративные) -->
        <rect x="25" y="75" width="15" height="20" rx="3" fill="#B02020" />
        <rect x="60" y="75" width="15" height="20" rx="3" fill="#B02020" />

        <!-- Левый рукав -->
        <path d="M 15 65 Q 5 60, 5 50 L 10 35 Q 15 30, 20 35 L 25 60 Q 20 65, 15 65 Z" fill="#D62828"/>
        
        <!-- Левая перчатка -->
        <path d="M 2 50 Q 0 45, 5 32 L 10 30 L 13 34 Q 15 40, 10 52 Z" fill="#333333"/>
    </g>

    <!-- Правый рукав (находится ЗА лопатой) -->
    <g id="right-sleeve">
        <path d="M 85 65 Q 95 60, 95 50 L 90 35 Q 85 30, 80 35 L 75 60 Q 80 65, 85 65 Z" fill="#D62828"/>
    </g>

    <!-- Лопата (вставлена между рукавом и перчаткой для эффекта хвата) -->
    <g id="shovel" transform="translate(5, 15) scale(0.35)">
        <!-- Штык лопаты -->
        <path fill="#363636" d="M250.11,468.57c-74.99-18.23-58.73-130.8-58.73-130.8c43.03,0.49,49.6-10.7,49.6-10.7h18.04 c0,0,6.57,11.18,49.6,10.7c0,0,16.26,112.57-58.73,130.8"/>
        
        <!-- Черенок лопаты -->
        <rect fill="#B4B1B2" height="176.38" width="18.04" x="240.98" y="114.27"/>
        <path fill="#565656" d="M240.98,284.57V388.8c0,4.98,4.04,9.02,9.02,9.02s9.02-4.04,9.02-9.02V284.57H240.98z"/>
        
        <!-- Ручка лопаты -->
        <path fill="#FEC602" d="M277.5,31.44h-55c-3.75,0-6.79,3.04-6.79,6.79v24.96c0,2.1,0.47,4.18,1.43,6.05 c5.28,10.3,13.09,17.98,22.17,21.41h-0.25v25.53h21.88V90.65h-0.25c9.09-3.43,16.89-11.11,22.17-21.41 c0.96-1.87,1.43-3.95,1.43-6.05V38.23C284.29,34.48,281.25,31.44,277.5,31.44z M272.85,62.81c0,1.4-0.31,2.79-0.95,4.03 c-4.84,9.44-12.85,15.6-21.9,15.6c-9.05,0-17.06-6.16-21.9-15.6c-0.64-1.24-0.95-2.63-0.95-4.03V46.17c0-2.5,2.03-4.53,4.53-4.53 h36.65c2.5,0,4.53,2.03,4.53,4.53L272.85,62.81L272.85,62.81z"/>
    </g>

    <!-- Правая перчатка (находится ПЕРЕД лопатой, перекрывая черенок) -->
    <g id="right-glove">
        <path d="M 98 50 Q 100 45, 95 32 L 90 30 L 87 34 Q 85 40, 90 52 Z" fill="#333333"/>
    </g>

    <!-- Голова и Капюшон (поверх всего) -->
    <g id="head-and-hood">
        <!-- Капюшон (внешняя часть) -->
        <path d="M 30 45 Q 25 25, 50 15 Q 75 25, 70 45 L 65 48 Q 50 55, 35 48 Z" fill="#D62828"/>

        <!-- Опушка капюшона (мех) -->
        <path d="M 32 43 Q 28 28, 50 20 Q 72 28, 68 43 L 64 45 Q 50 50, 36 45 Z" fill="#E0E0E0"/>

        <!-- Лицо (небольшой видимый участок) -->
        <ellipse cx="50" cy="35" rx="10" ry="12" fill="#F4C58E"/>

        <!-- Очки/Маска (линзы) -->
        <path d="M 38 38 Q 40 30, 50 30 Q 60 30, 62 38 Q 60 42, 50 42 Q 40 42, 38 38 Z" fill="#222222" opacity="0.8"/>
        <!-- Оправа очков (частично) -->
        <path d="M 37 39 L 35 38 M 63 39 L 65 38" stroke="#4A4A4A" stroke-width="1.5" fill="none"/>
    </g>

</svg>